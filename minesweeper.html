<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minesweeper</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Tahoma,Geneva,Verdana,Arial,sans-serif;background:#c0c0c0;min-height:100vh;
    display:flex;flex-direction:column;align-items:center;padding:12px;user-select:none;-webkit-user-select:none}
  .raised{background:#c0c0c0;border-top:3px solid #fff;border-left:3px solid #fff;border-right:3px solid #808080;border-bottom:3px solid #808080}
  .sunken{border-top:3px solid #808080;border-left:3px solid #808080;border-right:3px solid #fff;border-bottom:3px solid #fff}
  #game{padding:6px}
  #bar{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;margin-bottom:6px;background:#c0c0c0}
  .lcd{background:#000;color:#f00;font:bold 24px "Courier New",monospace;padding:0 4px;min-width:54px;text-align:center;letter-spacing:2px;line-height:34px}
  #face{width:38px;height:38px;font-size:22px;line-height:1;padding:0;cursor:pointer;background:#c0c0c0;
    border-top:2px solid #fff;border-left:2px solid #fff;border-right:2px solid #808080;border-bottom:2px solid #808080}
  #face:active{border-top-color:#808080;border-left-color:#808080;border-right-color:#fff;border-bottom-color:#fff}
  #board{display:grid;touch-action:manipulation}
  .c{width:26px;height:26px;display:flex;align-items:center;justify-content:center;font:bold 16px "Courier New",monospace;cursor:pointer;
    background:#c0c0c0;border-top:3px solid #fff;border-left:3px solid #fff;border-right:3px solid #808080;border-bottom:3px solid #808080}
  .c.open{border:1px solid #808080;background:#c0c0c0;cursor:default}
  .c.boom{background:#f00}
  .n1{color:#0000ff}.n2{color:#008000}.n3{color:#ff0000}.n4{color:#000080}.n5{color:#800000}.n6{color:#008080}.n7{color:#000}.n8{color:#808080}
  #levels{margin-top:10px;font-size:12px;display:flex;gap:6px;align-items:center}
  #levels button{font:inherit;padding:3px 8px;cursor:pointer;background:#c0c0c0;border-top:2px solid #fff;border-left:2px solid #fff;border-right:2px solid #808080;border-bottom:2px solid #808080}
  #levels button.on{font-weight:bold;border-top-color:#808080;border-left-color:#808080;border-right-color:#fff;border-bottom-color:#fff}
  .tip{font-size:11px;color:#404040;margin-top:8px;text-align:center}
  a.back{font-size:12px;color:#000080;margin-top:8px}
</style>
</head>
<body>
<div id="game" class="raised">
  <div id="bar" class="sunken">
    <div class="lcd" id="mines">010</div>
    <button id="face" aria-label="New game">🙂</button>
    <div class="lcd" id="time">000</div>
  </div>
  <div id="board" class="sunken"></div>
</div>
<div id="levels">Level:
  <button data-l="b" class="on">Beginner</button><button data-l="i">Intermediate</button>
</div>
<div class="tip">Tap to dig. Hold (or right click) to flag.</div>
<a class="back" href="index.html">Back home</a>
<script>
(function(){
  var LV={b:{w:9,h:9,m:10},i:{w:16,h:16,m:40}};
  var lvl='b',W,H,M,cells,over,started,flags,t0,timer,opened;
  var board=document.getElementById('board'),face=document.getElementById('face');
  var minesEl=document.getElementById('mines'),timeEl=document.getElementById('time');
  function pad(n){n=Math.max(-99,Math.min(999,n));return (n<0?'-':'')+String(Math.abs(n)).padStart(n<0?2:3,'0')}
  function nbrs(i){var x=i%W,y=(i/W)|0,r=[];for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;var nx=x+dx,ny=y+dy;if(nx>=0&&ny>=0&&nx<W&&ny<H)r.push(ny*W+nx)}return r}
  function reset(){
    clearInterval(timer);var c=LV[lvl];W=c.w;H=c.h;M=c.m;over=false;started=false;flags=0;opened=0;
    cells=[];board.innerHTML='';board.style.gridTemplateColumns='repeat('+W+',26px)';
    for(var i=0;i<W*H;i++){(function(i){
      var el=document.createElement('div');el.className='c';
      cells.push({m:false,o:false,f:false,n:0,el:el});
      var pt=null,long=false;
      el.addEventListener('pointerdown',function(e){if(e.button===2)return;long=false;pt=setTimeout(function(){long=true;flag(i)},420)});
      el.addEventListener('pointerup',function(e){clearTimeout(pt);if(e.button===2)return;if(!long)dig(i)});
      el.addEventListener('pointerleave',function(){clearTimeout(pt)});
      el.addEventListener('contextmenu',function(e){e.preventDefault();flag(i)});
      board.appendChild(el);
    })(i)}
    face.textContent='🙂';minesEl.textContent=pad(M);timeEl.textContent='000';
  }
  function place(safe){
    var ban={};ban[safe]=1;nbrs(safe).forEach(function(n){ban[n]=1});
    var left=M;while(left){var r=(Math.random()*W*H)|0;if(ban[r]||cells[r].m)continue;cells[r].m=true;left--}
    cells.forEach(function(c,i){c.n=nbrs(i).filter(function(n){return cells[n].m}).length});
  }
  function flag(i){
    var c=cells[i];if(over||c.o)return;c.f=!c.f;flags+=c.f?1:-1;c.el.textContent=c.f?'🚩':'';minesEl.textContent=pad(M-flags);
  }
  function show(i){
    var c=cells[i];c.o=true;opened++;c.el.className='c open'+(c.n&&!c.m?' n'+c.n:'');c.el.textContent=c.n&&!c.m?c.n:'';
  }
  function dig(i){
    var c=cells[i];if(over||c.o||c.f)return;
    if(!started){started=true;place(i);t0=Date.now();timer=setInterval(function(){timeEl.textContent=pad(Math.min(999,Math.floor((Date.now()-t0)/1000)))},250)}
    if(c.m){lose(i);return}
    var q=[i];show(i);
    if(!c.n){while(q.length){var k=q.pop();nbrs(k).forEach(function(n){var d=cells[n];if(!d.o&&!d.f&&!d.m){show(n);if(!d.n)q.push(n)}})}}
    if(opened===W*H-M)win();
  }
  function lose(i){
    over=true;clearInterval(timer);face.textContent='😵';
    cells.forEach(function(c,k){if(c.m&&!c.f){c.el.className='c open';c.el.textContent='💣'}else if(!c.m&&c.f){c.el.textContent='❌'}});
    cells[i].el.className='c open boom';cells[i].el.textContent='💣';
  }
  function win(){
    over=true;clearInterval(timer);face.textContent='😎';
    cells.forEach(function(c){if(c.m&&!c.f){c.f=true;c.el.textContent='🚩'}});minesEl.textContent='000';
  }
  face.addEventListener('click',reset);
  document.querySelectorAll('#levels button').forEach(function(b){b.addEventListener('click',function(){
    document.querySelectorAll('#levels button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');lvl=b.dataset.l;reset();
    if(window.top!==window.self)parent.postMessage({type:'resize-hint'},'*');
  })});
  reset();
  if(window.top!==window.self){document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a[href="index.html"]');if(a){e.preventDefault();parent.postMessage({type:'close-window'},'*')}})}
})();
</script>
</body>
</html>
