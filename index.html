<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:'Public Sans',system-ui,sans-serif;background:#0b0620}
  a{color:#ffffff;text-decoration:none}
  .wrap{min-height:100vh;position:relative;overflow:hidden;background:
    radial-gradient(circle at 15% 10%, #ffd6f7 0%, transparent 45%),
    radial-gradient(circle at 85% 15%, #b9f9ff 0%, transparent 45%),
    radial-gradient(circle at 50% 90%, #d9c8ff 0%, transparent 50%),
    linear-gradient(135deg,#6a3df5 0%,#9b3ddb 30%,#e23dbf 60%,#3dc9e2 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:64px 24px;font-family:'Baloo 2',system-ui,sans-serif;box-sizing:border-box}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px;position:relative;z-index:2;max-width:460px}
  .tile{display:flex;flex-direction:column;align-items:center;gap:16px}
  .icon{width:150px;height:150px;border-radius:38px;display:flex;align-items:center;justify-content:center;position:relative;box-sizing:border-box}
  .gloss{position:absolute;top:12px;left:18px;width:74px;height:30px;border-radius:18px;background:rgba(255,255,255,0.45);filter:blur(2px)}
  .label{font-size:22px;font-weight:800;color:#ffffff;text-shadow:0 2px 6px rgba(0,0,0,0.35)}
  .cta{position:relative;z-index:2;margin-top:48px;font-size:16px;font-weight:700;color:#ffffff;background:rgba(20,10,40,0.35);padding:12px 26px;border-radius:999px;border:2px solid rgba(255,255,255,0.6)}
  @media (max-width:420px){
    .icon{width:120px;height:120px}
    .label{font-size:18px}
    .grid{gap:28px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div style="position:absolute;top:56px;left:64px;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #ffffff, #ffe1fb 40%, transparent 70%);opacity:0.8"></div>
  <div style="position:absolute;bottom:72px;right:96px;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #ffffff, #d6fbff 40%, transparent 70%);opacity:0.7"></div>
  <div style="position:absolute;top:120px;right:140px;font-size:40px;color:#ffffff;opacity:0.55;transform:rotate(12deg)">✦</div>
  <div style="position:absolute;bottom:140px;left:120px;font-size:32px;color:#ffffff;opacity:0.5;transform:rotate(-18deg)">✦</div>

  <div class="grid">
    <a class="tile" href="https://ldfujiwara.github.io/event-board/">
      <div class="icon" style="background:linear-gradient(160deg,#5dd0ff 0%,#1f8fe0 100%);box-shadow:0 16px 0 rgba(20,70,120,0.35), inset 0 4px 0 rgba(255,255,255,0.55)">
        <div class="gloss"></div>
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18"></path></svg>
      </div>
      <div class="label">Events</div>
    </a>

    <a class="tile" href="https://ldfujiwara.github.io/learning-board/">
      <div class="icon" style="background:linear-gradient(160deg,#9dff7a 0%,#3fb840 100%);box-shadow:0 16px 0 rgba(20,90,20,0.35), inset 0 4px 0 rgba(255,255,255,0.55)">
        <div class="gloss"></div>
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"></path><path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"></path></svg>
      </div>
      <div class="label">Classroom</div>
    </a>

    <a class="tile" href="music.html">
      <div class="icon" style="background:linear-gradient(160deg,#ff8ed6 0%,#e0349b 100%);box-shadow:0 16px 0 rgba(120,10,80,0.35), inset 0 4px 0 rgba(255,255,255,0.55)">
        <div class="gloss"></div>
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
      </div>
      <div class="label">Music</div>
    </a>

    <a class="tile" href="reading.html">
      <div class="icon" style="background:linear-gradient(160deg,#c9a8ff 0%,#8a3ddb 100%);box-shadow:0 16px 0 rgba(70,20,110,0.35), inset 0 4px 0 rgba(255,255,255,0.55)">
        <div class="gloss"></div>
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"></path></svg>
      </div>
      <div class="label">Reading List</div>
    </a>
  </div>

  <a class="cta" href="https://docs.google.com/forms/d/e/1FAIpQLSficDBSfifCCjj4PQH3WmAyMWsO1mvac5TI4YXvu7jjiO_3gA/viewform">Got a rec for me? →</a>
</div>
</body>
</html>
