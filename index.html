<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andrew's Picks</title>
<style>
  :root{
    --teal:#008080;
    --grey:#c0c0c0;
    --grey-dark:#808080;
    --grey-darker:#404040;
    --white:#ffffff;
    --blue-title:#000080;
    --blue-title2:#1084d0;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;font-family:Tahoma,Geneva,Verdana,Arial,sans-serif;
    background:
      repeating-linear-gradient(45deg, rgba(0,0,0,0.035) 0 2px, transparent 2px 4px),
      var(--teal);
    min-height:100vh;overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none}

  .raised{
    background:var(--grey);
    border-top:2px solid var(--white);
    border-left:2px solid var(--white);
    border-right:2px solid var(--grey-darker);
    border-bottom:2px solid var(--grey-darker);
    box-shadow: inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 var(--grey-dark);
  }
  .sunken{
    background:var(--grey);
    border-top:2px solid var(--grey-darker);
    border-left:2px solid var(--grey-darker);
    border-right:2px solid var(--white);
    border-bottom:2px solid var(--white);
  }

  /* ---------- desktop icons ---------- */
  .desktop{
    padding:28px 18px 92px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  .icons{
    display:grid;
    grid-template-columns:repeat(auto-fill,116px);
    gap:30px 18px;
    justify-content:start;
  }
  .icon-tile{
    width:116px;display:flex;flex-direction:column;align-items:center;gap:8px;
    padding:8px 4px;border:1px dotted transparent;cursor:pointer;
  }
  .icon-tile:active{border-color:rgba(255,255,255,0.6);background:rgba(0,0,128,0.25)}
  .icon-glyph{
    width:68px;height:68px;display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .icon-glyph svg{width:100%;height:100%}
  .icon-box{
    width:60px;height:60px;
    display:flex;align-items:center;justify-content:center;
  }
  .icon-label{
    color:#ffffff;font-size:14px;text-align:center;line-height:1.3;
    text-shadow:1px 1px 1px #000000;
    padding:1px 4px;
  }
  .icon-tile:active .icon-label{background:var(--blue-title);text-shadow:none}

  /* ---------- welcome window ---------- */
  .window-wrap{
    flex:1;display:flex;align-items:flex-end;justify-content:center;
    padding-bottom:12px;
  }
  .window{
    width:100%;max-width:400px;
  }
  #recWindow{position:relative}
  .title-bar{
    background:linear-gradient(90deg,var(--blue-title),var(--blue-title2));
    color:#fff;display:flex;align-items:center;justify-content:space-between;
    padding:4px 4px 4px 8px;font-size:13px;font-weight:bold;letter-spacing:0.3px;
  }
  .title-buttons{display:flex;gap:3px}
  .title-buttons button{
    width:18px;height:16px;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:bold;color:#000;line-height:0;
    padding:0;margin:0;font-family:inherit;cursor:pointer;
  }
  .title-buttons button:active{
    border-top-color:var(--grey-darker);border-left-color:var(--grey-darker);
    border-right-color:var(--white);border-bottom-color:var(--white);
  }
  .window.appwin{
    position:fixed;display:flex;flex-direction:column;max-width:none;
  }
  .appwin.maximized{left:0!important;top:0!important;width:auto!important;height:auto!important;right:0;bottom:40px}
  .appwin .title-bar{cursor:default;user-select:none;-webkit-user-select:none;touch-action:none}
  .appwin .title-bar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px}
  .win-content{position:relative;flex:1;margin:3px;background:#fff;
    border-top:2px solid var(--grey-darker);border-left:2px solid var(--grey-darker);
    border-right:2px solid var(--white);border-bottom:2px solid var(--white);min-height:0}
  .win-content iframe{display:block;width:100%;height:100%;border:0;background:#fff}
  .win-shield{position:absolute;inset:0;z-index:2}
  .appwin.focused .win-shield{display:none}
  body.dragging iframe{pointer-events:none}
  body.dragging{cursor:move}
  [hidden]{display:none!important}
  .window-body{
    padding:18px 16px 16px;
    font-size:13px;color:#141414;
  }
  .window-body p{margin:0 0 14px;line-height:1.5}
  .win-button{
    display:inline-flex;align-items:center;gap:8px;
    padding:8px 16px;font-size:13px;color:#000;cursor:pointer;
  }
  .win-button:active{
    border-top-color:var(--grey-darker)!important;border-left-color:var(--grey-darker)!important;
    border-right-color:var(--white)!important;border-bottom-color:var(--white)!important;
    padding:9px 15px 7px 17px;
  }

  /* ---------- taskbar ---------- */
  .taskbar{
    position:fixed;left:0;right:0;bottom:0;height:40px;
    display:flex;align-items:center;gap:8px;padding:3px 6px;
    z-index:1000;
  }
  .start-button{
    display:flex;align-items:center;gap:8px;padding:4px 16px 4px 8px;
    font-weight:bold;font-size:15px;cursor:pointer;letter-spacing:0.3px;
    animation:startPulse 2.4s ease-in-out infinite;
  }
  .start-button:hover{
    background:#dcdcdc;color:var(--blue-title);
    animation:none;
    box-shadow:inset 1px 1px 0 #ffffff, inset -1px -1px 0 var(--grey-dark), 0 0 0 2px rgba(16,132,208,0.55);
  }
  .start-button:active{
    border-top-color:var(--grey-darker)!important;border-left-color:var(--grey-darker)!important;
    border-right-color:var(--white)!important;border-bottom-color:var(--white)!important;
  }
  .start-icon{font-size:20px;line-height:1;display:block;flex:none}
  @keyframes startPulse{
    0%,100%{box-shadow:inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 var(--grey-dark), 0 0 0 0 rgba(255,255,255,0)}
    50%{box-shadow:inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 var(--grey-dark), 0 0 0 4px rgba(255,255,255,0.55)}
  }
  @media (prefers-reduced-motion:reduce){
    .start-button{animation:none}
  }
  .taskbar-divider{width:2px;align-self:stretch;margin:2px 2px;border-left:1px solid var(--grey-darker);border-right:1px solid var(--white)}
  .task-item{
    display:flex;align-items:center;gap:6px;padding:5px 12px;font-size:13px;
    flex:0 1 170px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;
  }
  .task-item.active{
    border-top-color:var(--grey-darker)!important;border-left-color:var(--grey-darker)!important;
    border-right-color:var(--white)!important;border-bottom-color:var(--white)!important;
  }
  .taskbar-spacer{flex:1}
  .tray{
    display:flex;align-items:center;gap:8px;padding:4px 10px;font-size:12px;height:100%;
  }

  @media (min-width:640px){
    .desktop{padding:36px 28px 92px}
    .window-wrap{justify-content:flex-end;padding-right:24px}
    .window{max-width:300px}
  }
</style>
</head>

<script>
  function updateClock(){
    const d = new Date();
    let h = d.getHours();
    const m = String(d.getMinutes()).padStart(2,'0');
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    document.getElementById('clock').textContent = h + ':' + m + ' ' + ampm;
  }
  updateClock();
  setInterval(updateClock, 1000 * 15);

  const win = document.getElementById('recWindow');
  const task = document.getElementById('taskRec');
  const icon = document.getElementById('recIcon');
  function setActive(on){ task.classList.toggle('active', on); }
  document.getElementById('btnMin').addEventListener('click', function(){
    win.hidden = true; setActive(false);
  });
  task.addEventListener('click', function(){
    win.hidden = !win.hidden; setActive(!win.hidden);
    if (!win.hidden && typeof zTop !== 'undefined') { zTop++; win.style.zIndex = zTop;
      Object.values(wins).forEach(o => { o.el.classList.remove('focused'); o.task.classList.remove('active'); }); }
  });
  document.getElementById('btnClose').addEventListener('click', function(){
    win.hidden = true;
    task.hidden = true; icon.hidden = false;
  });
  // ---------- app windows ----------
  let zTop = 20, openCount = 0;
  const wins = {};            // url -> {el, task, min}
  const bar = document.querySelector('.taskbar');
  const spacer = document.querySelector('.taskbar-spacer');
  const isNarrow = () => window.innerWidth < 700;

  function focusWin(w){
    zTop++; w.el.style.zIndex = zTop;
    Object.values(wins).forEach(o => { o.el.classList.toggle('focused', o === w); o.task.classList.toggle('active', o === w && !o.min); });
    task.classList.remove('active');
  }
  function minimizeWin(w){
    w.min = true; w.el.hidden = true; w.task.classList.remove('active');
  }
  function restoreWin(w){
    w.min = false; w.el.hidden = false; focusWin(w);
  }
  function closeWin(w){
    w.el.remove(); w.task.remove(); delete wins[w.url];
  }
  function openApp(url, label){
    if (wins[url]) { restoreWin(wins[url]); return; }
    const w = {url:url, min:false};
    const el = document.createElement('div');
    el.className = 'window raised appwin';
    const vw = window.innerWidth, vh = window.innerHeight - 40;
    const width = Math.min(900, vw - 24), height = Math.min(640, vh - 24);
    const off = (openCount++ % 6) * 28;
    el.style.width = width + 'px'; el.style.height = height + 'px';
    el.style.left = Math.max(0, Math.round((vw - width)/2) - 60 + off) + 'px';
    el.style.top = Math.max(0, 14 + off) + 'px';
    if (isNarrow()) el.classList.add('maximized');
    const name = label.toUpperCase().replace(/\s+/g,'_') + '.EXE';
    el.innerHTML =
      '<div class="title-bar"><span></span><div class="title-buttons">' +
      '<button type="button" class="raised" data-a="min" aria-label="Minimize" title="Minimize">_</button>' +
      '<button type="button" class="raised" data-a="max" aria-label="Maximize" title="Maximize">□</button>' +
      '<button type="button" class="raised" data-a="close" aria-label="Close" title="Close">×</button>' +
      '</div></div><div class="win-content"><iframe title=""></iframe><div class="win-shield"></div></div>';
    el.querySelector('.title-bar span').textContent = name;
    const frame = el.querySelector('iframe');
    frame.title = label;
    // local pages always load fresh so stale cached copies can't misbehave
    frame.src = /^https?:/i.test(url) ? url : url + (url.indexOf('?') < 0 ? '?' : '&') + 'v=' + Date.now();
    // safety net: if a window ever lands on the home page, close it instead of nesting
    frame.addEventListener('load', function(){
      try {
        const path = frame.contentWindow.location.pathname;
        if (/(^|\/)(index\.html)?$/.test(path) && frame.contentDocument.querySelector('.taskbar')) closeWin(w);
      } catch (err) { /* cross-origin page: nothing to check */ }
    });
    document.body.appendChild(el);

    const t = document.createElement('button');
    t.type = 'button'; t.className = 'task-item raised'; t.textContent = name;
    bar.insertBefore(t, spacer);
    w.el = el; w.task = t; w.frame = frame; wins[url] = w;

    t.addEventListener('click', function(){
      if (w.min) restoreWin(w);
      else if (el.classList.contains('focused')) minimizeWin(w);
      else focusWin(w);
    });
    el.addEventListener('mousedown', () => { if (!el.classList.contains('focused')) focusWin(w); });
    el.querySelector('.win-shield').addEventListener('click', () => focusWin(w));
    el.querySelector('[data-a=min]').addEventListener('click', () => minimizeWin(w));
    el.querySelector('[data-a=max]').addEventListener('click', () => el.classList.toggle('maximized'));
    el.querySelector('[data-a=close]').addEventListener('click', () => closeWin(w));

    // drag by title bar
    const tb = el.querySelector('.title-bar');
    tb.addEventListener('pointerdown', function(e){
      if (e.target.closest('button') || el.classList.contains('maximized')) return;
      const r = el.getBoundingClientRect();
      const dx = e.clientX - r.left, dy = e.clientY - r.top;
      document.body.classList.add('dragging');
      tb.setPointerCapture(e.pointerId);
      function move(ev){
        const x = Math.min(Math.max(ev.clientX - dx, -width + 80), window.innerWidth - 80);
        const y = Math.min(Math.max(ev.clientY - dy, 0), window.innerHeight - 40 - 30);
        el.style.left = x + 'px'; el.style.top = y + 'px';
      }
      function up(){
        document.body.classList.remove('dragging');
        tb.removeEventListener('pointermove', move); tb.removeEventListener('pointerup', up);
      }
      tb.addEventListener('pointermove', move); tb.addEventListener('pointerup', up);
    });
    focusWin(w);
  }

  // icons and the Andrew button open as windows
  document.querySelectorAll('a.icon-tile[href]:not(#recIcon), a.start-button').forEach(function(a){
    a.addEventListener('click', function(e){
      if (e.ctrlKey || e.metaKey || e.shiftKey) return;
      e.preventDefault();
      const lab = a.querySelector('.icon-label');
      openApp(a.getAttribute('href'), lab ? lab.textContent.trim() : 'Andrew');
    });
  });

  // pages inside windows ask the desktop to close them
  window.addEventListener('message', function(e){
    if (!e.data || e.data.type !== 'close-window') return;
    Object.values(wins).forEach(function(w){ if (w.frame.contentWindow === e.source) closeWin(w); });
  });

  // clicking the recommendation window brings it forward
  win.addEventListener('mousedown', function(){
    zTop++; win.style.zIndex = zTop;
    Object.values(wins).forEach(o => { o.el.classList.remove('focused'); o.task.classList.remove('active'); });
    if (!win.hidden) setActive(true);
  });

  icon.addEventListener('click', function(e){
    e.preventDefault();
    win.hidden = false; task.hidden = false; icon.hidden = true; setActive(true);
  });
</script>
</body>
</html>
