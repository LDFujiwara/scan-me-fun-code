<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andrew's Picks</title>
<style>
  :root{
    --teal:#008080;
    --grey:#c0c0c0;
    --grey-dark:#808080;
    --grey-darker:#404040;
    --white:#ffffff;
    --blue-title:#000080;
    --blue-title2:#1084d0;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;font-family:Tahoma,Geneva,Verdana,Arial,sans-serif;
    background:
      repeating-linear-gradient(45deg, rgba(0,0,0,0.035) 0 2px, transparent 2px 4px),
      var(--teal);
    min-height:100vh;overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none}

  .raised{
    background:var(--grey);
    border-top:2px solid var(--white);
    border-left:2px solid var(--white);
    border-right:2px solid var(--grey-darker);
    border-bottom:2px solid var(--grey-darker);
    box-shadow: inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 var(--grey-dark);
  }
  .sunken{
    background:var(--grey);
    border-top:2px solid var(--grey-darker);
    border-left:2px solid var(--grey-darker);
    border-right:2px solid var(--white);
    border-bottom:2px solid var(--white);
  }

  /* ---------- desktop icons ---------- */
  .desktop{
    padding:28px 18px 92px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  .icons{
    display:grid;
    grid-template-columns:repeat(auto-fill,116px);
    gap:30px 18px;
    justify-content:start;
  }
  .icon-tile{
    width:116px;display:flex;flex-direction:column;align-items:center;gap:8px;
    padding:8px 4px;border:1px dotted transparent;cursor:pointer;
  }
  .icon-tile:active{border-color:rgba(255,255,255,0.6);background:rgba(0,0,128,0.25)}
  .icon-glyph{
    width:68px;height:68px;display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .icon-glyph svg{width:100%;height:100%}
  .icon-box{
    width:60px;height:60px;
    display:flex;align-items:center;justify-content:center;
  }
  .icon-label{
    color:#ffffff;font-size:14px;text-align:center;line-height:1.3;
    text-shadow:1px 1px 1px #000000;
    padding:1px 4px;
  }
  .icon-tile:active .icon-label{background:var(--blue-title);text-shadow:none}

  /* ---------- welcome window ---------- */
  .window-wrap{
    flex:1;display:flex;align-items:flex-end;justify-content:center;
    padding-bottom:12px;
  }
  .window{
    width:100%;max-width:400px;
  }
  .title-bar{
    background:linear-gradient(90deg,var(--blue-title),var(--blue-title2));
    color:#fff;display:flex;align-items:center;justify-content:space-between;
    padding:4px 4px 4px 8px;font-size:13px;font-weight:bold;letter-spacing:0.3px;
  }
  .title-buttons{display:flex;gap:3px}
  .title-buttons span{
    width:18px;height:16px;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:bold;color:#000;line-height:0;
  }
  .window-body{
    padding:18px 16px 16px;
    font-size:13px;color:#141414;
  }
  .window-body p{margin:0 0 14px;line-height:1.5}
  .win-button{
    display:inline-flex;align-items:center;gap:8px;
    padding:8px 16px;font-size:13px;color:#000;cursor:pointer;
  }
  .win-button:active{
    border-top-color:var(--grey-darker)!important;border-left-color:var(--grey-darker)!important;
    border-right-color:var(--white)!important;border-bottom-color:var(--white)!important;
    padding:9px 15px 7px 17px;
  }

  /* ---------- taskbar ---------- */
  .taskbar{
    position:fixed;left:0;right:0;bottom:0;height:40px;
    display:flex;align-items:center;gap:8px;padding:3px 6px;
    z-index:10;
  }
  .start-button{
    display:flex;align-items:center;gap:8px;padding:4px 16px 4px 8px;
    font-weight:bold;font-size:15px;cursor:pointer;letter-spacing:0.3px;
    animation:startPulse 2.4s ease-in-out infinite;
  }
  .start-button:hover{
    background:#dcdcdc;color:var(--blue-title);
    animation:none;
    box-shadow:inset 1px 1px 0 #ffffff, inset -1px -1px 0 var(--grey-dark), 0 0 0 2px rgba(16,132,208,0.55);
  }
  .start-button:active{
    border-top-color:var(--grey-darker)!important;border-left-color:var(--grey-darker)!important;
    border-right-color:var(--white)!important;border-bottom-color:var(--white)!important;
  }
  .start-icon{font-size:20px;line-height:1;display:block;flex:none}
  @keyframes startPulse{
    0%,100%{box-shadow:inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 var(--grey-dark), 0 0 0 0 rgba(255,255,255,0)}
    50%{box-shadow:inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 var(--grey-dark), 0 0 0 4px rgba(255,255,255,0.55)}
  }
  @media (prefers-reduced-motion:reduce){
    .start-button{animation:none}
  }
  .taskbar-divider{width:2px;align-self:stretch;margin:2px 2px;border-left:1px solid var(--grey-darker);border-right:1px solid var(--white)}
  .task-item{
    display:flex;align-items:center;gap:6px;padding:5px 12px;font-size:13px;
    max-width:180px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  }
  .task-item.active{
    border-top-color:var(--grey-darker)!important;border-left-color:var(--grey-darker)!important;
    border-right-color:var(--white)!important;border-bottom-color:var(--white)!important;
  }
  .taskbar-spacer{flex:1}
  .tray{
    display:flex;align-items:center;gap:8px;padding:4px 10px;font-size:12px;height:100%;
  }

  @media (min-width:640px){
    .desktop{padding:36px 28px 92px}
    .window-wrap{justify-content:flex-end;padding-right:24px}
    .window{max-width:300px}
  }
</style>
</head>
<body>
<div class="desktop">

  <div class="icons">

</div>

<div class="taskbar raised">
  <a class="start-button raised" href="start.html" title="Open Andrew's profile">
    <span class="start-icon" aria-hidden="true">👾</span>
    Andrew
  </a>
  <div class="taskbar-divider"></div>
  <button class="task-item raised active">Andrew's Picks</button>
  <div class="taskbar-spacer"></div>
  <div class="tray sunken"><span id="clock">--:--</span></div>
</div>

<script>
  function updateClock(){
    const d = new Date();
    let h = d.getHours();
    const m = String(d.getMinutes()).padStart(2,'0');
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    document.getElementById('clock').textContent = h + ':' + m + ' ' + ampm;
  }
  updateClock();
  setInterval(updateClock, 1000 * 15);
</script>
</body>
</html>
