<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gear</title>
<style>
  :root{
    --grey:#c0c0c0; --grey-dark:#808080; --grey-darker:#404040; --white:#fff;
    --blue:#000080; --blue2:#1084d0;
  }
  *{box-sizing:border-box}
  body{
    margin:0;font-family:Tahoma,Geneva,Verdana,Arial,sans-serif;color:#141414;
    background:#008080 repeating-linear-gradient(45deg, rgba(0,0,0,0.035) 0 2px, transparent 2px 4px);
    min-height:100vh;padding:20px 16px 40px;
  }
  .raised{
    background:var(--grey);
    border-top:2px solid var(--white);border-left:2px solid var(--white);
    border-right:2px solid var(--grey-darker);border-bottom:2px solid var(--grey-darker);
    box-shadow:inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 var(--grey-dark);
  }
  .sunken{
    background:#fff;
    border-top:2px solid var(--grey-darker);border-left:2px solid var(--grey-darker);
    border-right:2px solid var(--white);border-bottom:2px solid var(--white);
  }
  .wrap{max-width:980px;margin:0 auto}
  .back{display:inline-block;color:#fff;font-size:13px;text-decoration:none;
    text-shadow:1px 1px 1px #000;border-bottom:1px solid rgba(255,255,255,0.5);margin-bottom:14px}
  .head{padding:16px 18px;margin-bottom:14px}
  .head h1{margin:0 0 4px;font-size:20px;color:var(--blue)}
  .head p{margin:0;font-size:13px;line-height:1.5}
  .disclosure{font-size:11px;color:var(--grey-darker);margin-top:8px}

  .tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:-2px;position:relative;z-index:1;padding-left:6px}
  .tab{
    font:inherit;font-size:13px;padding:6px 14px;cursor:pointer;color:#000;
    background:var(--grey);border:2px solid;border-color:var(--white) var(--grey-darker) transparent var(--white);
    box-shadow:inset 1px 1px 0 #dfdfdf;
  }
  .tab[aria-selected="true"]{font-weight:bold;padding-bottom:8px;margin-top:-3px}
  .panel{padding:16px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
  .card{padding:10px;display:flex;flex-direction:column;gap:8px}
  .shot{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:44px;overflow:hidden}
  .shot img{width:100%;height:100%;object-fit:contain;display:block}
  .tag{font-size:11px;color:var(--grey-darker);text-transform:uppercase;letter-spacing:0.6px}
  .name{font-size:15px;font-weight:bold;color:var(--blue);line-height:1.25}
  .why{font-size:12.5px;line-height:1.5;flex:1}
  .go{
    display:inline-flex;justify-content:center;padding:7px 12px;font-size:13px;color:#000;text-decoration:none;
  }
  .go:active{
    border-top-color:var(--grey-darker);border-left-color:var(--grey-darker);
    border-right-color:var(--white);border-bottom-color:var(--white);
  }
  .links{display:flex;flex-direction:column;gap:6px}
  .go{flex:1}
  .empty{padding:24px;text-align:center;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Back home</a>

  <div class="head raised">
    <h1>Gear I stand by</h1>
    <p>Stuff I actually use and would buy again. If it's on this list, it earned its spot.</p>
    <div class="disclosure" id="disclosure"></div>
  </div>

  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="panel sunken"><div class="grid" id="grid"></div></div>
</div>

<script>
  /* ------------------------------------------------------------------
     EDIT THIS LIST. One entry per product.
       tabs   : which tabs it shows under (one or more); every item also shows on "All"
       name   : product name
       why    : one or two lines on why you stand by it (optional)
       link   : one link, shown as a "Check it out" button
       links  : OR several links: [{label:"Waterproof →", url:"..."}, ...]
       image  : optional, e.g. "assets/gear/knife.jpg" (emoji shows if blank)
       emoji  : shown when there's no image
     ------------------------------------------------------------------ */
  const AFFILIATE_NOTE = "";  // e.g. "Some links are affiliate links. I may earn a small commission at no cost to you."
  const TAB_ORDER = ["Music","Kitchen","Clothing","Motorsport","Tactical","Athletics","Tech"];

  const GEAR = [
    {"tabs": ["Music"], "name": "Evans RealFeel Practice Pad", "why": "", "emoji": "🥁", "image": "", "link": "https://daddario.com/products/percussion/percussion-accessories/drum-pads-stands/realfeel-practice-pad-6-inch"},
    {"tabs": ["Music", "Tech"], "name": "Beats Solo Buds", "why": "", "emoji": "🎧", "image": "", "link": "https://www.beatsbydre.com/earbuds/solo-buds"},
    {"tabs": ["Kitchen"], "name": "Korin Hammered Damascus Wa-Gyuto with Saya, 8.2", "why": "", "emoji": "🔪", "image": "", "link": "https://www.korin.com/HKR-HDWGY-210"},
    {"tabs": ["Kitchen"], "name": "Ganji Kankiri Can Opener", "why": "", "emoji": "🥫", "image": "", "link": "https://www.korin.com/Japanese-Can-Opener-Ganji-Kankiri-4-5-L-3-W"},
    {"tabs": ["Clothing", "Kitchen"], "name": "Dr. Martens 1460 Slip Resistant Leather Lace Up Boots", "why": "", "emoji": "🥾", "image": "", "link": "https://www.drmartens.com/us/en/1460-slip-resistant-leather-lace-up-boots-black/p/24382001"},
    {"tabs": ["Clothing", "Motorsport"], "name": "Onitsuka Tiger Serrano", "why": "", "emoji": "👟", "image": "", "link": "https://www.onitsukatiger.com/be/en-be/shoes/view-all-shoes/serrano/"},
    {"tabs": ["Clothing", "Tactical"], "name": "Danner Tachyon Boots", "why": "", "emoji": "🥾", "image": "", "links": [{"label": "Waterproof →", "url": "https://www.danner.com/tachyon-8-black-gtx.html"}, {"label": "Non-waterproof →", "url": "https://global.danner.com/tachyon-8-black.html"}]},
    {"tabs": ["Clothing"], "name": "Muji Denim Easy Pants", "why": "", "emoji": "👖", "image": "", "link": "https://www.muji.us/products/recycled-cotton-denim-easy-pants-ae12n26a"},
    {"tabs": ["Clothing"], "name": "Uniqlo AIRism Cotton Long Sleeve", "why": "", "emoji": "👕", "image": "", "link": "https://www.uniqlo.com/us/en/products/E465193-000/00"},
    {"tabs": ["Clothing"], "name": "Orvis PRO LT Softshell Vest", "why": "", "emoji": "🦺", "image": "", "link": "https://www.orvis.com/product/mens-pro-lt-softshell-vest/3NC2.html"},
    {"tabs": ["Clothing"], "name": "ODGG Supply USMC FROG Waffle Top", "why": "", "emoji": "🧥", "image": "", "link": "https://odggsupply.com/products/usmc-frog-waffle-tops-tottoms"},
    {"tabs": ["Athletics", "Clothing"], "name": "ASICS Gel-Venture 11", "why": "", "emoji": "👟", "image": "", "link": "https://www.asics.com/us/en-us/gel-venture%C2%A011/p/ANA_1011C160-001.html"},
    {"tabs": ["Motorsport"], "name": "Sparco Arrow+ Gloves", "why": "", "emoji": "🧤", "image": "", "link": "https://www.sparcousa.com/arrow-2"},
    {"tabs": ["Motorsport"], "name": "Sparco RW9 Hood", "why": "", "emoji": "🏁", "image": "", "link": "https://www.sparcousa.com/product/hood-shield-rw-9-3"},
    {"tabs": ["Tactical"], "name": "Magpul CTR Carbine Stock, Mil-Spec", "why": "", "emoji": "🔩", "image": "", "link": "https://magpul.com/ctr-carbine-stock-mil-spec.html"},
    {"tabs": ["Tactical"], "name": "Magpul Barricade Stop, M-LOK", "why": "", "emoji": "🔩", "image": "", "link": "https://magpul.com/magpul-barricade-stop-m-lok.html"},
    {"tabs": ["Tactical"], "name": "Magpul WCK Wire Control Kit, M-LOK", "why": "", "emoji": "🔩", "image": "", "link": "https://magpul.com/wck-wire-control-kit-m-lok.html"},
    {"tabs": ["Tactical"], "name": "Magpul M-LOK Rail Covers, Type 2", "why": "", "emoji": "🔩", "image": "", "link": "https://magpul.com/m-lok-rail-covers-type2.html"},
    {"tabs": ["Tactical"], "name": "Magpul MBUS Sights", "why": "", "emoji": "🎯", "image": "", "links": [{"label": "Front sight →", "url": "https://magpul.com/mbus-sight-front.html"}, {"label": "Rear sight →", "url": "https://magpul.com/mbus-sight-rear.html"}]},
    {"tabs": ["Tactical", "Athletics"], "name": "5.11 RUSH LBD XRAY Duffel Bag 106L", "why": "", "emoji": "🎒", "image": "", "link": "https://www.evike.com/products/100872/5.11-Tactical-Rush-LBD-XRAY-106L-Duffel-Bag/"},
    {"tabs": ["Tactical", "Tech"], "name": "Nocs Provisions Zoom Tube 8x32 Monocular", "why": "", "emoji": "🔭", "image": "", "link": "https://www.nocsprovisions.com/products/zoom-tube-8x32-monocular-telescope"},
    {"tabs": ["Athletics"], "name": "TaylorMade BRNR Mini Driver", "why": "", "emoji": "⛳", "image": "", "link": "https://www.taylormadegolf.com/BRNR-Mini-Driver/DW-TA111.html"},
    {"tabs": ["Athletics"], "name": "TaylorMade Stealth Fairway Wood", "why": "", "emoji": "⛳", "image": "", "link": "https://www.taylormadegolf.com/Stealth-Fairway/DW-TA031.html"},
    {"tabs": ["Athletics"], "name": "Lucky Golf Gold Putter", "why": "", "emoji": "⛳", "image": "", "link": "https://www.luckygolf.com/products/limited-edition-mallet-putter"},
    {"tabs": ["Athletics"], "name": "Golf Pride Grips", "why": "", "emoji": "⛳", "image": "", "link": "https://www.golfpride.com/us/en-us/swing-grips.html"},
    {"tabs": ["Tech"], "name": "Pentax ME", "why": "", "emoji": "📷", "image": "", "link": "https://kenrockwell.com/pentax/35mm/cameras/me.htm"},
    {"tabs": ["Tech"], "name": "Goal Zero Venture 35 Power Bank", "why": "", "emoji": "🔋", "image": "", "link": "https://goalzero.com/products/venture-35-power-bank"}
  ];

  const used = new Set(); GEAR.forEach(g => g.tabs.forEach(t => used.add(t)));
  const cats = ["All"].concat(TAB_ORDER.filter(t => used.has(t)), [...used].filter(t => !TAB_ORDER.includes(t)));
  const tabsEl = document.getElementById('tabs');
  const grid = document.getElementById('grid');
  let current = "All";

  function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

  function render(){
    tabsEl.innerHTML = "";
    cats.forEach(c => {
      const b = el('button', 'tab', c);
      b.type = 'button'; b.setAttribute('role','tab'); b.setAttribute('aria-selected', c === current);
      b.addEventListener('click', () => { current = c; render(); });
      tabsEl.appendChild(b);
    });
    grid.innerHTML = "";
    const items = GEAR.filter(g => current === "All" || g.tabs.includes(current));
    if (!items.length) { grid.appendChild(el('div','empty','Nothing here yet.')); return; }
    items.forEach(g => {
      const card = el('div','card raised');
      const shot = el('div','shot sunken');
      if (g.image) { const im = new Image(); im.src = g.image; im.alt = g.name; shot.appendChild(im); }
      else shot.textContent = g.emoji || "📦";
      card.appendChild(shot);
      card.appendChild(el('div','tag', g.tabs.join(" \u00b7 ")));
      card.appendChild(el('div','name', g.name));
      card.appendChild(el('div','why', g.why || ""));
      const links = g.links || (g.link ? [{label:"Check it out \u2192", url:g.link}] : []);
      if (links.length) {
        const row = el('div','links');
        links.forEach(l => {
          const a = el('a','go raised', l.label);
          a.href = l.url; a.target = "_blank"; a.rel = "noopener sponsored";
          row.appendChild(a);
        });
        card.appendChild(row);
      }
      grid.appendChild(card);
    });
  }
  document.getElementById('disclosure').textContent = AFFILIATE_NOTE;
  render();

  // inside a desktop window, "home" closes the window instead
  if (window.top !== window.self) {
    document.addEventListener('click', function(e){
      var a = e.target.closest && e.target.closest('a[href="index.html"]');
      if (a) { e.preventDefault(); parent.postMessage({type:'close-window'}, '*'); }
    });
  }
</script>
</body>
</html>
