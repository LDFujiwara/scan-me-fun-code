<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<style>
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{
    margin:0;
    font-family:Tahoma,Geneva,Verdana,Arial,sans-serif;
    background:#121216;
    color:#d8d8e0;
    padding:48px 24px 72px;
    position:relative;
    overflow-x:hidden;
  }

  /* ---- soft splotchy background: black, greys, very subtle dark purple ---- */
  body::before{
    content:"";
    position:fixed;inset:-15%;
    z-index:-1;
    background:
      radial-gradient(ellipse 30% 26% at 24% 20%, rgba(240,240,248,0.55), transparent 70%),
      radial-gradient(ellipse 26% 34% at 74% 44%, rgba(235,235,245,0.42), transparent 70%),
      radial-gradient(ellipse 32% 24% at 30% 66%, rgba(238,238,248,0.46), transparent 70%),
      radial-gradient(ellipse 24% 30% at 92% 80%, rgba(240,240,250,0.40), transparent 70%),
      radial-gradient(ellipse 22% 22% at 56% 6%, rgba(232,232,244,0.38), transparent 70%),
      radial-gradient(ellipse 45% 38% at 10% 12%, rgba(120,120,130,0.75), transparent 72%),
      radial-gradient(ellipse 36% 44% at 88% 8%, rgba(78,78,88,0.85), transparent 72%),
      radial-gradient(ellipse 40% 32% at 62% 30%, rgba(78,48,112,0.50), transparent 72%),
      radial-gradient(ellipse 46% 40% at 14% 50%, rgba(64,64,72,0.90), transparent 74%),
      radial-gradient(ellipse 34% 42% at 90% 54%, rgba(118,118,128,0.65), transparent 72%),
      radial-gradient(ellipse 42% 34% at 44% 74%, rgba(72,44,104,0.45), transparent 72%),
      radial-gradient(ellipse 40% 36% at 8% 90%, rgba(104,104,114,0.70), transparent 72%),
      radial-gradient(ellipse 38% 34% at 80% 92%, rgba(70,42,100,0.42), transparent 74%),
      radial-gradient(ellipse 30% 26% at 50% 8%, rgba(16,16,20,0.85), transparent 72%),
      radial-gradient(ellipse 28% 24% at 36% 40%, rgba(12,12,16,0.80), transparent 72%),
      #121216;
    filter:blur(40px);
  }

  .back{
    display:inline-block;
    font-size:13px;
    letter-spacing:0.4px;
    color:rgba(245,245,252,0.92);
    text-shadow:0 1px 6px rgba(0,0,0,0.85);
    text-decoration:none;
    border-bottom:1px solid rgba(235,235,245,0.3);
    padding-bottom:2px;
  }
  .back:hover{color:#fff;border-bottom-color:rgba(255,255,255,0.7)}

  /* ---- free-floating art ---- */
  .gallery{
    max-width:1100px;
    margin:36px auto 0;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:44px 40px;
  }
  .piece{
    margin:0;
    background:#1c1c22;
    border:1px solid rgba(255,255,255,0.14);
    box-shadow:
      0 0 0 6px rgba(0,0,0,0.28),
      0 14px 34px rgba(0,0,0,0.65),
      0 3px 8px rgba(0,0,0,0.5);
    display:flex;
    align-items:center;
    justify-content:center;
    color:rgba(255,255,255,0.35);
    font-size:12px;
    letter-spacing:0.4px;
    overflow:hidden;
  }
  .piece img{display:block;width:100%;height:100%;object-fit:cover}

  /* placeholder sizes, varied so the layout feels loose and floating */
  .s1{width:260px;aspect-ratio:4/5}
  .s2{width:340px;aspect-ratio:1/1}
  .s3{width:300px;aspect-ratio:3/4}
  .s4{width:380px;aspect-ratio:4/3}
  .s5{width:240px;aspect-ratio:2/3}
  .s6{width:320px;aspect-ratio:1/1}

  @media (max-width:560px){
    body{padding:32px 16px 56px}
    .gallery{gap:32px}
    .piece{width:100%!important;max-width:420px}
  }
</style>
</head>
<body>
  <a class="back" href="index.html">← Back home</a>

  <div class="gallery">
    <figure class="piece s1">Artwork 1</figure>
    <figure class="piece s2">Artwork 2</figure>
    <figure class="piece s3">Artwork 3</figure>
    <figure class="piece s4">Artwork 4</figure>
    <figure class="piece s5">Artwork 5</figure>
    <figure class="piece s6">Artwork 6</figure>
  </div>
</body>
</html>
