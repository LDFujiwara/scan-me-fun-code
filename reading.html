<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading List</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --green-deep:#2f4a3c;
    --green-mid:#5c7a63;
    --green-soft:#a9c2a6;
    --beige:#f3ecdc;
    --beige-dark:#e4d9bd;
    --ink:#24301f;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Public Sans',system-ui,sans-serif;color:var(--ink);
    background:
      linear-gradient(180deg, var(--beige) 0%, var(--beige) 55%, var(--green-soft) 100%),
      repeating-linear-gradient(135deg, rgba(92,122,99,0.06) 0 2px, transparent 2px 40px);
  }
  a{color:inherit;text-decoration:none}
  header{padding:48px 24px 28px;text-align:center}
  .back{display:inline-block;margin-bottom:18px;font-size:14px;font-weight:600;color:var(--green-mid);border-bottom:1px solid var(--green-mid);padding-bottom:2px}
  h1{font-family:'Fraunces',serif;font-size:clamp(32px,6vw,48px);margin:0;color:var(--green-deep);letter-spacing:0.5px}
  .sub{margin-top:10px;font-size:15px;color:var(--green-mid);font-weight:500}
  main{max-width:640px;margin:0 auto;padding:0 20px 40px}
  .list{display:flex;flex-direction:column;gap:14px}
  .row{display:flex;align-items:center;gap:18px;background:rgba(255,255,255,0.55);
    border:1px solid rgba(47,74,60,0.12);border-radius:14px;padding:14px 18px;
    transition:transform .15s ease, box-shadow .15s ease;}
  .row:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(47,74,60,0.12);background:rgba(255,255,255,0.8)}
  .cover{flex:none;width:52px;height:74px;border-radius:5px;background:linear-gradient(160deg,var(--green-soft),var(--green-mid));
    display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;letter-spacing:0.5px;color:#f3ecdc;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,0.08);background-size:cover;background-position:center}
  a.row{cursor:pointer}
  .info{display:flex;flex-direction:column;gap:3px;min-width:0}
  .title{font-family:'Fraunces',serif;font-weight:700;font-size:17px;color:var(--green-deep);line-height:1.25}
  .author{font-size:13px;color:var(--green-mid);font-weight:500}
  footer{text-align:center;padding:12px 24px 60px}
  .cta{display:inline-block;margin-top:8px;font-size:15px;font-weight:600;color:#f3ecdc;background:var(--green-deep);
    padding:12px 26px;border-radius:999px}
  footer p{font-size:13px;color:var(--green-mid);margin:0 0 4px}
</style>
</head>
<body>
<header>
  <a class="back" href="index.html">← Back home</a>
  <h1>Reading List</h1>
  <div class="sub">Books I've read, loved, or keep pushing on people.</div>
</header>
<main>
  <div class="list" id="bookList">
    <div style="color:var(--green-mid);font-size:14px;text-align:center;padding:20px 0">Loading books…</div>
  </div>
</main>
<footer>
  <p>Have a book I should read?</p>
  <a class="cta" href="https://docs.google.com/forms/d/e/1FAIpQLSficDBSfifCCjj4PQH3WmAyMWsO1mvac5TI4YXvu7jjiO_3gA/viewform">Send a rec →</a>
</footer>
<script>
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Live book cover + link lookup via the Open Library search API — public,
  // keyless, and generous with rate limits (unlike Google Books' anonymous quota).
  function loadBookCache() {
    try { return JSON.parse(localStorage.getItem('bookCacheV3') || '{}'); } catch (e) { return {}; }
  }
  function saveBookCache(c) {
    try { localStorage.setItem('bookCacheV3', JSON.stringify(c)); } catch (e) {}
  }
  const bookCache = loadBookCache();

  async function getBookInfo(title, author) {
    const key = (title + '|' + author).toLowerCase();
    if (bookCache[key] !== undefined) return bookCache[key];
    try {
      const q = 'title=' + encodeURIComponent(title) + '&author=' + encodeURIComponent(author);
      const res = await fetch('https://openlibrary.org/search.json?' + q + '&limit=1');
      if (!res.ok) return null; // don't cache a transient failure, so a later load can retry
      const data = await res.json();
      let info = null;
      const doc = data.docs && data.docs[0];
      if (doc) {
        info = {
          cover: doc.cover_i ? ('https://covers.openlibrary.org/b/id/' + doc.cover_i + '-L.jpg') : null,
          link: doc.key ? ('https://openlibrary.org' + doc.key) : null
        };
      }
      bookCache[key] = info;
      saveBookCache(bookCache);
      return info;
    } catch (e) {
      return null;
    }
  }

  function fallbackLink(title, author) {
    return 'https://openlibrary.org/search?q=' + encodeURIComponent(title + ' ' + author);
  }

  function render(books) {
    const container = document.getElementById('bookList');
    container.innerHTML = books.map((b, i) => `
      <a class="row" id="row-${i}" href="${esc(fallbackLink(b.title, b.author))}" target="_blank" rel="noopener">
        <div class="cover">COVER</div>
        <div class="info">
          <div class="title">${esc(b.title)}</div>
          <div class="author">${esc(b.author)}</div>
        </div>
      </a>
    `).join('');

    books.forEach((b, i) => {
      getBookInfo(b.title, b.author).then(info => {
        if (!info) return;
        const rowEl = document.getElementById('row-' + i);
        if (!rowEl) return;
        if (info.link) rowEl.href = info.link;
        if (info.cover) {
          const coverEl = rowEl.querySelector('.cover');
          coverEl.style.backgroundImage = `url('${info.cover}')`;
          coverEl.style.border = 'none';
          coverEl.textContent = '';
        }
      });
    });
  }

  fetch('data/books.json?v=' + Date.now())
    .then(r => r.json())
    .then(books => render(books))
    .catch(() => {
      document.getElementById('bookList').innerHTML = '<div style="color:var(--green-mid);font-size:14px;text-align:center">Couldn\'t load the reading list right now.</div>';
    });
</script>
</body>
</html>
